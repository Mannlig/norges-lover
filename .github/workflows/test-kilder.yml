name: Test kildene fra GitHub

# Kjøres manuelt (Actions → «Test kildene fra GitHub» → Run workflow).
# Henter noen få sider fra hver kilde med samme kode som Pi-en og viser
# resultatet i jobbsammendraget. Pusher ingenting og rører ikke Pi-en.
# Svarer også på om kildene slipper til GitHubs servere – altså om
# scrapingen kunne flyttet hit fra Pi-en.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rpi-scraper

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Scrapling med nettleser
        run: |
          pip install --quiet -r rpi-scraper/requirements.txt
          scrapling install

      - name: Kjør sonden
        working-directory: rpi-scraper
        run: python tests/kildeprobe.py
