name: Valider kode

on:
  push:
    branches: [main]
    paths:
      - "rpi-scraper/**/*.py"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "rpi-scraper/**/*.py"
      - ".github/workflows/*.yml"

jobs:
  syntaks-sjekk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Sjekk Python-syntaks
        run: |
          python3 -m compileall -q rpi-scraper/
          echo "Alle Python-filer er gyldige"

      - name: Sjekk YAML-syntaks i workflows
        run: |
          python3 - <<'EOF'
          import sys, yaml
          from pathlib import Path
          feil = []
          for f in Path(".github/workflows").glob("*.yml"):
              try:
                  yaml.safe_load(f.read_text(encoding="utf-8"))
              except yaml.YAMLError as e:
                  feil.append(f"{f}: {e}")
          if feil:
              print("\n".join(feil))
              sys.exit(1)
          print("Alle workflow-filer er gyldige")
          EOF

      - name: Varsle med issue hvis main er ødelagt
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "kode-odelagt",
            });
            if (issues.length > 0) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🔑 Ugyldig kode pushet til main – Pi-en vil krasje",
              body: [
                "Syntaks-sjekken feilet for commit " + context.sha.substring(0, 7) + ".",
                "",
                "Pi-en kjører `git reset --hard origin/main` hver syklus og vil",
                "krasje på hver kjøring til dette er fikset.",
                "",
                "Se workflow-loggen: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              ].join("\n"),
              labels: ["kode-odelagt"],
            });
