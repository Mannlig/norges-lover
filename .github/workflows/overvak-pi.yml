name: Overvåk Pi – heartbeat-sjekk

on:
  schedule:
    # Kjør kl. 08:00 UTC hver dag
    - cron: "0 8 * * *"
  workflow_dispatch:

# GitHub-brukeren som skal varsles. Tildeling + @-omtale gir e-post via
# GitHub sine standard notification-innstillinger – ingen SMTP-oppsett.
env:
  VARSLE_BRUKER: Mannlig

jobs:
  sjekk-heartbeat:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Hent siste commit-dato for heartbeat-filen
        id: sjekk
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "data/status/heartbeat.md",
              per_page: 1,
            });

            if (commits.length === 0) {
              core.setOutput("stille", "true");
              core.setOutput("siste", "aldri");
              core.setOutput("timer_siden", "ukjent");
              return;
            }

            const sisteDato = new Date(commits[0].commit.author.date);
            const now = new Date();
            const timerSiden = (now - sisteDato) / 1000 / 3600;

            core.setOutput("timer_siden", timerSiden.toFixed(1));
            core.setOutput("siste", sisteDato.toISOString());
            // 20 t: en runde etter at køen er nullstilt kan ta 8–12 t, og
            // falske alarmer gjør at de ekte blir oversett.
            core.setOutput("stille", timerSiden > 20 ? "true" : "false");

      - name: Varsle hvis Pi er stille
        if: steps.sjekk.outputs.stille == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const timerSiden = "${{ steps.sjekk.outputs.timer_siden }}";
            const siste = "${{ steps.sjekk.outputs.siste }}";
            const bruker = process.env.VARSLE_BRUKER;
            const dager = (Number(timerSiden) / 24).toFixed(1);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pi-stille",
            });

            // Finnes det allerede et varsel? Purr på det i stedet for å
            // lage et nytt – ett enkelt issue som ingen ser er nettopp
            // grunnen til at nedetid har fått stå i ukevis.
            if (issues.length > 0) {
              const issue = issues[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${bruker} Pi-en er **fortsatt** stille – ${timerSiden} timer (${dager} døgn) siden siste heartbeat.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: `⚠️ Pi har ikke kjørt på ${dager} døgn`,
              });
              console.log(`Purret på issue #${issue.number} (${timerSiden}t nede).`);
              return;
            }

            const body = [
              `@${bruker} – automatisk varsel: Pi-en er stille.`,
              "",
              `Siste heartbeat-commit: **${siste}**`,
              `Stille i: **${timerSiden} timer**`,
              "",
              "### Sjekk på Pi-en",
              "```bash",
              "cd ~/norges-lover",
              "docker compose logs --tail=300 | grep -E 'PUSH|KRASJ|Starter scraper'",
              "docker compose ps        # kjører containeren?",
              "df -h /                  # fullt SD-kort?",
              "```",
              "",
              "| Det du ser | Årsak | Tiltak |",
              "|---|---|---|",
              "| `PUSH-TILGANG AVVIST` | Token utløpt eller trukket tilbake. Pi-en lever, men venter. | Nytt token i `.env`, så `docker compose up -d --force-recreate` |",
              "| `PUSH FEILET` | Push feilet midt i en runde (nett, konflikt) | Går som regel over av seg selv neste runde |",
              "| `ps` tom / `Exited` | Containeren er nede | `docker compose up -d` |",
              "| `df` viser 100 % | Fullt SD-kort | `docker system prune -a` og `git gc --aggressive` |",
              "| Ingen logglinjer de siste timene | Pi-en er nede eller uten strøm | Sjekk strøm og nett |",
              "",
              "*Lukkes automatisk når Pi-en er i gang igjen. Purres daglig til da.*",
            ].join("\n");

            const { data: nytt } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Pi har ikke kjørt på ${timerSiden} timer`,
              body,
              labels: ["pi-stille"],
            });

            // Tildeling gir e-post selv om @-omtalen skulle bli oversett.
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: nytt.number,
                assignees: [bruker],
              });
            } catch (e) {
              console.log(`Kunne ikke tildele til ${bruker}: ${e.message}`);
            }

      - name: Lukk issue hvis Pi er i gang igjen
        if: steps.sjekk.outputs.stille == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pi-stille",
            });

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Pi er i gang igjen – heartbeat registrert. Lukker automatisk.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      # Pi-en lever, men enkeltkilder kan være døde (blokkert, ny HTML, krasj).
      # Heartbeaten har en maskinlesbar linje: <!-- helse: kilde=OK kilde=FEIL -->
      - name: Varsle om kilder med feil
        if: steps.sjekk.outputs.stille == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const bruker = process.env.VARSLE_BRUKER;
            const LABEL = "kilde-feil";
            const { data: fil } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "data/status/heartbeat.md",
            });
            const tekst = Buffer.from(fil.content, "base64").toString("utf-8");
            const linje = tekst.match(/<!-- helse: (.*?) -->/);
            if (!linje) {
              console.log("Heartbeat har ingen helselinje ennå (gammel kode på Pi-en).");
              return;
            }
            const feil = linje[1].split(/\s+/)
              .map(p => p.split("="))
              .filter(([, status]) => status === "FEIL")
              .map(([kilde]) => kilde);

            const { data: aapne } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: LABEL,
            });

            if (feil.length === 0) {
              for (const issue of aapne) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "✅ Alle kilder er OK i siste heartbeat. Lukker automatisk.",
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            const problemer = (tekst.split("## Problemer")[1] || "").trim();
            const tittel = `⚠️ Kilde med feil: ${feil.join(", ")}`;
            if (aapne.length > 0) {
              const issue = aapne[0];
              if (issue.title !== tittel) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  title: tittel,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `@${bruker} Endring i hvilke kilder som feiler: **${feil.join(", ")}**\n\n${problemer}`,
                });
              }
              return;
            }

            const { data: nytt } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: tittel,
              labels: [LABEL],
              body: [
                `@${bruker} – Pi-en kjører, men én eller flere kilder leverer ikke.`,
                "",
                problemer,
                "",
                "Se [heartbeat](../blob/main/data/status/heartbeat.md) for tall per kilde.",
                "Typiske årsaker: nettstedet blokkerer oss, har fått ny HTML, eller er nede.",
                "",
                "```bash",
                "docker compose logs --tail=500 | grep -iE 'KRASJ|feil på rad|HTTP 4|HTTP 5|For lite innhold'",
                "```",
                "",
                "*Lukkes automatisk når alle kilder er OK igjen.*",
              ].join("\n"),
            });
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: nytt.number,
                assignees: [bruker],
              });
            } catch (e) {
              console.log(`Kunne ikke tildele: ${e.message}`);
            }
